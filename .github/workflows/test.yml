name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Match the available hosted pool used by public CI and image builds.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build service and public packages
        run: pnpm build

      - name: native Claude Code and Codex packages
        run: pnpm test:agents

      - name: retain native agent installation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports
          path: .tmp/agent-reports/
          if-no-files-found: error
          retention-days: 14

      - name: packed consumer checks
        run: pnpm test:packed

      - name: service consuming packed public artifacts
        run: pnpm test:packed:service

      - name: upload packed service release evidence
        uses: actions/upload-artifact@v4
        with:
          name: packed-service-evidence
          path: .tmp/packed-service-report.json
          if-no-files-found: error
          retention-days: 14

      - name: typecheck
        run: |
          pnpm typecheck
          pnpm -r --if-present typecheck

      - name: coverage report and failure-gate tests
        run: node --import tsx --test oss/scripts/coverage-report.test.mjs oss/scripts/test-coverage.test.mjs oss/scripts/release-artifacts.test.mjs oss/scripts/recover-release.test.mjs oss/scripts/registry-artifacts.test.mjs test/harness/*.test.mjs

      - name: pull vector image
        # All per-package vector-validate tests reach for
        # timberio/vector:0.55.0-debian. Pre-pulling here lets the test
        # phase below run with no per-suite docker latency.
        run: docker pull timberio/vector:0.55.0-debian

      - name: real Bun Railway WebSocket helper
        run: pnpm test:railway-runtime

      - name: real Bun Vercel streaming helper and delivery
        run: pnpm test:vercel-runtime

      - name: custom Vector named outputs and isolated wildcards
        run: pnpm test:custom-vector-flow

      - name: real Supabase polling and Slack delivery
        run: pnpm test:supabase-runtime

      - name: real Supabase refresh sidecar token rotation and delivery
        run: pnpm test:supabase-refresh-runtime

      - name: real AI Gateway list fanout and delivery
        run: pnpm test:ai-gateway-runtime

      - name: real Fly CLI transport and structured log delivery
        run: pnpm test:fly-source-runtime

      - name: real Prometheus and Datadog encoded metrics delivery
        run: pnpm test:metrics-runtime

      - name: real Vector delivery flow
        run: pnpm test:flow

      - name: install Chromium for the real website journey
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .tmp/playwright

      - name: installed CLI and real local workerd runtime journey
        run: |
          pnpm typecheck:e2e
          pnpm test:e2e:local
          LOGT_E2E_INJECT_FAILURE=after-create pnpm test:e2e:local
          LOGT_E2E_INJECT_FAILURE=after-legacy-redeployment pnpm test:e2e:local

      - name: test
        # Runs every vitest project: workerd integration tests (real
        # D1 + Queues, only external HTTP mocked), @logtura/core unit
        # tests, every driver + destination package's unit tests, and
        # the per-package vector-validate tests that hand each
        # bundle's YAML to `vector validate` inside the image above.
        # The legacy scripts/test-vector-config.mjs has been retired;
        # the per-package tests subsume every fixture it ran.
        run: pnpm test:coverage
        env:
          LOGT_REQUIRE_DOCKER: "1"

      - name: UI tests and complete UI coverage baseline
        run: pnpm test:ui:coverage

      - name: upload coverage artifacts
        id: coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: coverage summary and 95% changed-line gate
        if: always()
        run: node scripts/coverage-report.mjs --report coverage --report coverage/ui
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
