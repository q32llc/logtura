name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build public packages
        run: pnpm -r --workspace-concurrency=1 --if-present build

      - name: packed consumer checks
        run: pnpm test:packed

      - name: typecheck
        run: pnpm typecheck

      - name: pull vector image
        # All per-package vector-validate tests reach for
        # timberio/vector:0.55.0-debian. Pre-pulling here lets the test
        # phase below run with no per-suite docker latency.
        run: docker pull timberio/vector:0.55.0-debian

      - name: real Vector delivery flow
        run: pnpm test:flow

      - name: test
        # Runs every vitest project: workerd integration tests (real
        # D1 + Queues, only external HTTP mocked), @logtura/core unit
        # tests, every driver + destination package's unit tests, and
        # the per-package vector-validate tests that hand each
        # bundle's YAML to `vector validate` inside the image above.
        # The legacy scripts/test-vector-config.mjs has been retired;
        # the per-package tests subsume every fixture it ran.
        run: pnpm vitest run --coverage
        env:
          LOGT_REQUIRE_DOCKER: "1"

      - name: upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: workspace
