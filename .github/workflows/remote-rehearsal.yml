name: remote Cloudflare rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logtura-remote-cloudflare-rehearsal
  cancel-in-progress: false
jobs:
  remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: verified packed candidate export
        run: pnpm test:packed:service
        env:
          LOGT_PACKED_SERVICE_OUTPUT: .tmp/remote-candidate
      - name: isolated real Cloudflare D1 and HTTP rehearsal
        run: pnpm test:e2e:cloudflare
        env:
          LOGT_E2E_ALLOW_CLOUDFLARE: '1'
          LOGT_E2E_CLOUDFLARE_ARTIFACT: .tmp/remote-candidate
          BOOTSTRAP_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LOGT_E2E_CLOUDFLARE_ACCOUNT_ID }}
          BOOTSTRAP_CLOUDFLARE_API_TOKEN: ${{ secrets.LOGT_E2E_CLOUDFLARE_API_TOKEN }}
      - name: recovery of interrupted owned rehearsal resources
        if: always()
        run: |
          for ledger in .tmp/cloudflare-e2e/run-*/run.json; do
            [ -f "$ledger" ] || continue
            LOGT_E2E_CLOUDFLARE_LEDGER="$ledger" pnpm test:e2e:cloudflare --cleanup
          done
        env:
          LOGT_E2E_ALLOW_CLOUDFLARE: '1'
          BOOTSTRAP_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LOGT_E2E_CLOUDFLARE_ACCOUNT_ID }}
          BOOTSTRAP_CLOUDFLARE_API_TOKEN: ${{ secrets.LOGT_E2E_CLOUDFLARE_API_TOKEN }}
      - name: redacted release and owned resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-cloudflare-evidence
          path: |
            .tmp/packed-service-report.json
            .tmp/cloudflare-e2e/run-*/run.json
            .tmp/cloudflare-e2e/run-*/routing.json
          if-no-files-found: error
          retention-days: 14
