name: build-forwarder

# Builds the logtura-forwarder kitchen-sink image. The Dockerfile is
# *generated* from every registered provider driver's dockerfileDeps
# via scripts/build-forwarder-dockerfile.mjs — so a driver bump that
# adds an apt package or a COPY --from line causes a rebuild here
# without anyone hand-maintaining containers/forwarder/Dockerfile.
#
# Triggers on changes to:
#  - packages/** (driver dockerfileDeps live here)
#  - scripts/build-forwarder-dockerfile.mjs (the generator itself)
#
# Pushes both :latest and :sha-<full> so deploys can pin by SHA.
on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "scripts/build-forwarder-dockerfile.mjs"
      - ".github/workflows/build-forwarder.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: regenerate kitchen-sink Dockerfile from drivers
        run: pnpm tsx scripts/build-forwarder-dockerfile.mjs

      - name: show generated Dockerfile (for audit)
        run: cat containers/forwarder/Dockerfile.generated

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: containers/forwarder
          file: containers/forwarder/Dockerfile.generated
          push: true
          # Fly shared-cpu-1x is amd64; that's our deploy target.
          # When we add arm64 deploy targets we'll go multi-arch.
          platforms: linux/amd64
          tags: |
            ghcr.io/q32llc/logtura-forwarder:latest
            ghcr.io/q32llc/logtura-forwarder:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
