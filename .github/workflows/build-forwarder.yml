name: build-forwarder

# Builds the logtura-forwarder image used by managed deploys and
# pushes it to ghcr.io/q32llc/logtura-forwarder. We tag :latest
# always; downstream deployments reference :latest. When we want
# pinned-version deploys later, tag with the commit SHA too and
# capture it in the deploy job's payload.
on:
  push:
    branches: [master]
    paths:
      - "containers/forwarder/**"
      - ".github/workflows/build-forwarder.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: containers/forwarder
          push: true
          # Fly shared-cpu-1x is amd64; that's our deploy target.
          # When we add arm64 deploy targets we'll go multi-arch.
          platforms: linux/amd64
          tags: |
            ghcr.io/q32llc/logtura-forwarder:latest
            ghcr.io/q32llc/logtura-forwarder:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
