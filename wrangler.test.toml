# Test-only wrangler config. Strips:
#   - [assets] (requires a built ./dist; not used in API tests)
#   - [triggers] cron (we don't want scheduled handlers firing during
#     a test run; we exercise routes directly)
# Keeps D1 and the native Queue producer binding. Tests deliver native incoming
# batches explicitly; no automatic consumer may race their per-test HTTP mocks
# or execute imports after the test environment has closed. An empty Miniflare
# queueConsumers override does not remove consumers merged from this file.
name = "logtura"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[env.test.vars]
APP_URL = "http://localhost"
# Deterministic test secrets — never used outside the test pool.
# CREDENTIAL_ENCRYPTION_KEY is 32 bytes of zero, base64url-encoded.
SESSION_SECRET = "test-session-secret-do-not-use-in-prod"
CREDENTIAL_ENCRYPTION_KEY = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
GITHUB_CLIENT_ID = "test"
GITHUB_CLIENT_SECRET = "test"
SLACK_CLIENT_ID = "test"
SLACK_CLIENT_SECRET = "test"
VERCEL_CLIENT_ID = "test_vercel_client"
VERCEL_CLIENT_SECRET = "test_vercel_secret"
RAILWAY_CLIENT_ID = "test_railway_client"
RAILWAY_CLIENT_SECRET = "test_railway_secret"
POSTMARK_API_KEY = "test"
FROM_EMAIL = "test@example.com"

[[env.test.d1_databases]]
binding = "DB"
database_name = "logtura"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.test.queues.producers]]
binding = "JOBS_QUEUE"
queue = "logtura-jobs"
