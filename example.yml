# Example logtura.yaml for the OSS CLI.
#
# Run:
#   logtura validate -c example.yml
#   logtura bundle -c example.yml -o dist/logtura-forwarder
#   logtura install-zip -c example.yml -o logtura-forwarder.tgz

sources:
  workers:
    provider: cloudflare-worker-tail
    account_id: env:CLOUDFLARE_ACCOUNT_ID
    api_token: env:CLOUDFLARE_API_TOKEN
    scripts:
      - dirtsignal
      - ipogrid

sinks:
  slack:
    type: slack
    webhook_url: env:SLACK_WEBHOOK_URL
    channel: "#alerts"

monitors:
  - name: worker-errors
    filter:
      - errors
      - rollup:
          window_secs: 30
          group_by: [script]
          max_samples: 5
    sinks: [slack]

metrics: none
