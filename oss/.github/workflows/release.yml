name: release

on:
  push:
    tags:
      - "v*"

# Needed so the workflow can create the GitHub release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # setup-node writes a project-local .npmrc with
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}. pnpm
          # publish reads that token from .npmrc, no interactive
          # OTP / 2FA needed. The NPM_TOKEN secret must be an
          # Automation-type granular access token (or any token
          # without 2FA) scoped to publish on @logtura.
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same test gate the push workflow uses. If tests fail on a
      # tag, the release does not ship to npm or GitHub.
      - name: pull vector image
        run: docker pull timberio/vector:latest-debian

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm vitest run

      - name: publish to npm
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: create GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
