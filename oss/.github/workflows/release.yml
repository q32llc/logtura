name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable stable tag to recover
        required: true
        type: string
      evidence_run:
        description: Completed tag run with tested release-evidence artifacts
        required: true
        type: string

permissions:
  # contents:write so the workflow can create the GitHub release.
  contents: write
  actions: read
  # id-token:write so npm Trusted Publishing can exchange an OIDC
  # token for a short-lived publish token at the registry. No
  # long-lived NPM_TOKEN to rotate.
  #
  # Each @logtura/* package must have a Trusted Publisher
  # configured on npmjs.com pointing at this workflow:
  #   logtura / logtura / release.yml (no environment)
  id-token: write

concurrency:
  group: logtura-npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: verify LFS pointers and downloaded object integrity
        run: git lfs fsck

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Node 24 because the bundled npm is 11.x and we need
          # npm 11.5+ for trusted publishing (OIDC). Node 22's
          # bundled npm is 10.9, which doesn't know how to do the
          # OIDC dance.
          node-version: 24
          cache: pnpm
          # NOTE: no `registry-url` here. setup-node's registry-url
          # writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # and the presence of that line tells the npm CLI to use
          # that token instead of triggering OIDC trusted publishing.
          # With OIDC we don't supply a token; we need npm to fall
          # through to the OIDC dance, which only happens when there
          # is no _authToken in the user's npmrc.

      - run: pnpm install --frozen-lockfile

      - name: require every package version to match the release tag
        run: node scripts/release-artifacts.mjs --check-tag

      - name: release artifact and recovery guards
        run: node --test scripts/release-artifacts.test.mjs

      - name: pull vector image
        run: docker pull timberio/vector:0.55.0-debian

      - name: build public packages
        run: pnpm -r --workspace-concurrency=1 --if-present build

      - name: packed consumer checks
        run: pnpm test:packed
        env:
          LOGT_PACKED_ARTIFACTS: .tmp/release

      - name: native Claude Code and Codex packages
        run: pnpm test:agents

      - name: archive tested skill and plugin release assets
        run: node scripts/agent-artifacts.mjs --archive .tmp/release/agents

      - name: typecheck
        run: pnpm typecheck

      - name: real Bun Railway WebSocket helper and delivery
        run: pnpm test:railway-runtime

      - name: real Bun Vercel streaming helper and delivery
        run: pnpm test:vercel-runtime

      - name: custom Vector named outputs and isolated wildcards
        run: pnpm test:custom-vector-flow

      - name: real Supabase polling and Slack delivery
        run: pnpm test:supabase-runtime

      - name: real Supabase refresh sidecar token rotation and delivery
        run: pnpm test:supabase-refresh-runtime

      - name: real AI Gateway list fanout and delivery
        run: pnpm test:ai-gateway-runtime

      - name: real Fly CLI transport and structured log delivery
        run: pnpm test:fly-source-runtime

      - name: real Prometheus and Datadog encoded metrics delivery
        run: pnpm test:metrics-runtime

      - name: real Vector delivery flow
        run: pnpm test:flow

      - name: test
        run: pnpm test:coverage
        env:
          LOGT_REQUIRE_DOCKER: "1"
      - name: publish to npm
        # --provenance opts into npm's OIDC trusted-publishing flow.
        # No NPM_TOKEN env needed; the GH Actions OIDC token + the
        # per-package trusted-publisher config on npmjs.com authorize
        # the publish. Also produces SLSA provenance attestations
        # visible on each package's npm page.
        # Publish the tested bytes with npm's supported OIDC client. Existing
        # immutable versions must match their integrity; collisions fail before
        # any publish. All registry hashes must verify before creating a release.
        run: node scripts/release-artifacts.mjs --publish .tmp/release/manifest.json

      - name: retain tested archives and complete or partial registry receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .tmp/release/
            coverage/
            .tmp/agent-reports/
          if-no-files-found: error
          retention-days: 30

      - name: installed public registry consumer checks
        run: pnpm test:packed
        env:
          LOGT_PACKED_REGISTRY_MANIFEST: .tmp/release/manifest.json

      - name: create GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            .tmp/release/*.tgz .tmp/release/manifest.json .tmp/release/registry-receipt.json .tmp/release/agents/*
        env:
          GH_TOKEN: ${{ github.token }}

  recover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOGT_RELEASE_TAG: ${{ inputs.release_tag }}
      LOGT_RELEASE_EVIDENCE_RUN: ${{ inputs.evidence_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: test recovery guards before selecting the immutable source
        run: node --test scripts/release-artifacts.test.mjs scripts/recover-release.test.mjs
      - name: preserve recovery tools and check out the original tag
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";assert.match(process.env.LOGT_RELEASE_TAG,/^v\d+\.\d+\.\d+$/);'
          mkdir -p .tmp/recovery-tools
          cp scripts/release-artifacts.mjs scripts/recover-release.mjs scripts/agent-artifacts.mjs .tmp/recovery-tools/
          git checkout --detach "refs/tags/$LOGT_RELEASE_TAG"
      - name: verify original validation run and recover exact tested archives
        run: node .tmp/recovery-tools/recover-release.mjs "$LOGT_RELEASE_EVIDENCE_RUN"
      - name: resume missing immutable publications and verify all registry hashes
        run: node .tmp/recovery-tools/release-artifacts.mjs --publish .tmp/release/manifest.json
      - name: retain exact recovery evidence and complete or partial receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-evidence
          path: .tmp/release/
          if-no-files-found: error
          retention-days: 30
      - name: create the verified tag release with exact archives
        run: |
          if gh release view "$LOGT_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag release already exists; verified registry receipt is retained"
          else
            assets=(.tmp/release/*.tgz .tmp/release/manifest.json .tmp/release/registry-receipt.json .tmp/release/recovery-evidence.json)
            if [ -d .tmp/release/agents ]; then assets+=(.tmp/release/agents/*); fi
            gh release create "$LOGT_RELEASE_TAG" --title "$LOGT_RELEASE_TAG" --generate-notes "${assets[@]}"
          fi
