name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build public packages
        run: pnpm -r --workspace-concurrency=1 --if-present build

      - name: packed consumer checks
        run: pnpm test:packed

      - name: typecheck
        run: pnpm typecheck

      - name: coverage report and failure-gate tests
        run: node --test scripts/coverage-report.test.mjs scripts/test-coverage.test.mjs

      - name: pull vector image
        # Each driver/destination package's vector-validate.test.ts
        # shells out to `docker run timberio/vector:0.55.0-debian`.
        # Pre-pull here so the test phase doesn't pay the docker pull
        # latency per suite.
        run: docker pull timberio/vector:0.55.0-debian

      - name: real Bun Railway WebSocket helper
        run: pnpm test:railway-runtime

      - name: real Bun Vercel streaming helper and delivery
        run: pnpm test:vercel-runtime

      - name: real Vector delivery flow
        run: pnpm test:flow

      - name: test
        # Runs every package's vitest project: unit tests for the
        # renderer + each driver/destination's parser & yaml, plus
        # the docker-backed vector-validate tests that pipe each
        # bundle's emitted YAML through the real Vector binary.
        run: pnpm test:coverage
        env:
          LOGT_REQUIRE_DOCKER: "1"

      - name: upload coverage artifacts
        id: coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: coverage summary and 95% changed-line gate
        if: always()
        run: node scripts/coverage-report.mjs --report coverage
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
