name = "logtura"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://logtura.erik-f0c.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "logtura"
database_id = "f8275804-591c-479b-b628-f678233b6bb6"
preview_database_id = "f8275804-591c-479b-b628-f678233b6bb6"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "logtura-jobs"

[[queues.consumers]]
queue = "logtura-jobs"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 3

# Silence alerter — every 5 minutes, find running deployments that
# stopped heartbeating and email the owner.
[triggers]
crons = ["*/5 * * * *"]
